# SITE CONFIGURATION
title: Mappia Documentation
author: CSR
description: > # Meta description of Homepage
  A service to share maps. Publish maps online, and easily create customized platforms
  using geographic data.

# SEO PLUGIN
social:
  name: CSR
  links:
    - https://maps.csr.ufmg.br

# THEME SETTINGS
navigation: # Navigation links
  - {name: 'Home', link: '/'}
  - {name: 'Documentation', link: '/documentation'}
  - {name: 'API Reference', link: '/api'}
  - {name: 'Change Log', link: '/changelog'}
  - {name: 'Publish Maps Yourself', link: '/mappia_publisher'}
  - {name: 'About', link: '/about'}

disable_disk_cache: true

tagline: >
  Documentation for using Mappia

hero_img: posts/CSR-Maps-bg.jpg # Main background image: use the path from /assets/img/ => This will output /assets/img/posts/sleek_lg.jpg

email: null # email for form submission

twitter_username: null
github_username: CSRMaps
instagram_username: null

disqus:
  shortname: null # to enable comments replace with your_disqus_shortname

# google_tag_manager: GTM-XXXXXXX # Uncomment to enable GTM. Replace GTM-XXXXXXX with your GTM container ID

service_worker: true

# BUILD SETTINGS
markdown: kramdown
highlighter: rouge # or pygments or null
# theme: jekyll-sleek # Uncomment if you're using the theme as a ruby gem
exclude:
  - README.md
  - node_modules
  - script
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - vendor
  - npm-debug.log
  - gulpfile.js
  # Local-only files and folders: not site content, and some are large.
  # lixo/ holds a stray copy of node_modules (~29k files) that Jekyll otherwise reads and
  # copies into _site on every build - the main reason builds were slow.
  - lixo
  - gulpfile.babel.js
  - jekyll-sleek.gemspec
  - start.bat
  - install.bat
  - debug.log
  - 5.4.0
  # Image sources for gulp (and the raw widget screenshots): never site content, and writing
  # a screenshot there made a running `jekyll serve` regenerate the whole site each time.
  - _img

include: ['_pages']
permalink: /:title/

collections:
  reference:
    output: true
  examples:
    output: true
  elements:
    output: true
  raw_maps:
    output: true
  change_logs:
    output: true
  # The step-by-step tutorial: _tutorial/NN-slug.md, ordered by their step number.
  tutorial:
    output: true
    permalink: /tutorial/:path/

defaults:
  - scope:
      path: "_tutorial"
      type: "tutorial"
    values:
      layout: "tutorial"
      docs_nav: true
  - scope:
      path: "_change_logs"
    values:
      layout: "change_log_default"
  - scope:
      path: "_elements"
      type: "elements"
    values:
      # Their bodies are raw blocks (they show widget markup), which Jekyll cannot excerpt.
      excerpt_separator: ""
  - scope:
      path: "_reference"
      type: "reference"
    values:
      layout: "reference"
      # The chapter bodies are wrapped in a raw block (the markup they document is also
      # Liquid), which Jekyll cannot excerpt - and nothing on the site uses the excerpt.
      excerpt_separator: ""

future: true

compress_html:
  clippings: all

maps:
  base: https://maps.csr.ufmg.br/?
  calculator: https://maps.csr.ufmg.br/calculator/?
  editor: https://maps.csr.ufmg.br/editor/?
  # Id of the saved query "Documentation examples - map catalogue" (MappiaExplorer
  # .cursor/skills/mappia-tenant-query/examples/docs-catalogue.query.js, regenerated by publish-docs.js).
  # With it the live maps open with ?queryid=<id>&options=capabilities,waitmessage and read a
  # capabilities document of a few kB instead of the whole catalogue. Empty: the whole catalogue.
  catalogue_queryid: ""

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
